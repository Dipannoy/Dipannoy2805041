<rect x="368" y="62" width="268" height="56" rx="10" ry="10" fill="#fdefe2" stroke="#ecb488" stroke-width="1.25"/>
<text x="502.0" y="80.5" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#853f14" text-anchor="middle">AA'BB'X₆ double perovskites</text>
<text x="502.0" y="97.5" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7c8f" text-anchor="middle">structures generated by the</text>
<text x="502.0" y="109.5" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7c8f" text-anchor="middle">bond-valence method</text>
