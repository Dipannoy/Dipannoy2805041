<text x="502.0" y="160.5" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">adaptation</text>
<text x="502.0" y="177.5" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f3d3ba" text-anchor="middle">initialised from the transferred source</text>
