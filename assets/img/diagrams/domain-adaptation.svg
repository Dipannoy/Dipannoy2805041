<rect x="36" y="44" width="280" height="150" rx="12" ry="12" fill="none" stroke="#bd9d84" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.95"/>
<text x="49" y="37" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6b7c8f" letter-spacing="1.1">SOURCE DOMAIN</text>
<rect x="52" y="64" width="248" height="46" rx="10" ry="10" fill="#f3f0eb" stroke="#d5ccbd" stroke-width="1.25"/>
<text x="176.0" y="92.0" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4a423a" text-anchor="middle">500 ABX₃ compounds</text>
<path d="M176,112 L176,130" fill="none" stroke="#bd9d84" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="52" y="132" width="248" height="56" rx="10" ry="10" fill="#fbe4d3" stroke="#df9f68" stroke-width="1.25"/>
<text x="176.0" y="156.5" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#77340c" text-anchor="middle">Train source GNN</text>
<text x="176.0" y="173.5" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7c8f" text-anchor="middle">SchNet · PAiNN · ALIGNN</text>
<path d="M318,119 L348,119" fill="none" stroke="#bd9d84" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
