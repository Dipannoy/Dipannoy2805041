<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 342" width="960" height="342" role="img" aria-label="Domain adaptation pipeline">
<title>Domain adaptation pipeline</title><desc>Weights trained on 500 ABX3 compounds are transferred to a double-perovskite target domain, refined by three rounds of uncertainty-driven active learning, then used to screen 222,960 candidates.</desc>
