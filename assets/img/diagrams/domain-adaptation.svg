<text x="806.0" y="187.5" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7c8f" text-anchor="middle">samples</text>
<path d="M760,196 L760,216 L440,216 L440,198" fill="none" stroke="#bd9d84" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="600.0" y="211.0" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="600" fill="#6b7c8f" text-anchor="middle">retrain on the enlarged set</text>
<path d="M910,196 L940,196 L940,238 L161,238 L161,260" fill="none" stroke="#bd9d84" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
