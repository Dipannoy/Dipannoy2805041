<text x="391" y="320" font-family="'Latin Modern Roman','Nimbus Roman','Times New Roman',Times,serif" font-size="10.5" fill="#666666" font-weight="400" text-anchor="middle">Swapping the two mechanisms separates the conditioning scheme from the</text>
<text x="391" y="334" font-family="'Latin Modern Roman','Nimbus Roman','Times New Roman',Times,serif" font-size="10.5" fill="#666666" font-weight="400" text-anchor="middle">backbone, so a difference in control cannot be blamed on the model it came from.</text>
