<text x="391.0" y="387.0" font-family="'Latin Modern Roman','Nimbus Roman','Times New Roman',Times,serif" font-size="10.5" fill="#666666" font-weight="400" text-anchor="middle">GemNet  ·  EquiformerV2</text>
